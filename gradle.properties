# Project Configuration
group = org.calypsonet.keyple
title = Keyple Plugin CNA Famoco SE Communication Java Lib
description = Keyple add-on to manage Famoco SE Communication readers
version = 2.1.0-SNAPSHOT

# Java Configuration
javaSourceLevel = 1.8
javaTargetLevel = 1.8

# UTF-8 required by javadoc for special characters (ex. copyright) with Java 11+
org.gradle.jvmargs = -Dfile.encoding=UTF-8

# Android Configuration (custom properties)
androidLibNamespace = org.calypsonet.keyple.plugin.famoco
androidAppNamespace = org.calypsonet.keyple.plugin.famoco.example
androidAppId = org.calypsonet.keyple.plugin.famoco.example
androidAppVersionCode = 1
androidCompileSdk = 35
androidMinSdk = 26

# Android Project Configuration (global properties)
# Kotlin code style for this project ("official" or "obsolete"): use the official Kotlin coding conventions
kotlin.code.style=official
# Use AndroidX libraries instead of legacy Android Support libraries (required for modern Android)
android.useAndroidX=true
# No conversion of third-party libraries using old support libraries to AndroidX (Jetifier): no library requires it
android.enableJetifier=false

# Documentation Configuration
javadoc.logo = ""
javadoc.copyright = Copyright &copy; Calypso Networks Association, Inc. All Rights Reserved.

# Project URLs
project.url = https://github.com/calypsonet/keyple-plugin-cna-famoco-se-communication-java-lib

# Organization
organization.name = Calypso Networks Association
organization.url = https://calypsonet.org/

# License
license.name = Eclipse Public License - v 2.0
license.url = https://www.eclipse.org/legal/epl-2.0
license.distribution = repo

# Developers
developer.name = Calypso Networks Association Technical Team
developer.email = support-dev@calypsonet.org

# Source Control Management
scm.connection = scm:git:git://github.com/calypsonet/keyple-plugin-cna-famoco-se-communication-java-lib.git
scm.developerConnection = scm:git:https://github.com/calypsonet/keyple-plugin-cna-famoco-se-communication-java-lib.git
scm.url = https://github.com/calypsonet/keyple-plugin-cna-famoco-se-communication-java-lib

# Continuous Integration
ci.system = GitHub Actions
ci.url = https://github.com/calypsonet/keyple-plugin-cna-famoco-se-communication-java-lib/actions
